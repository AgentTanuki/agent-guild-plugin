name: Plugin security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@f776571a4dee5b70a85869eb5c188cd9a6c5bc6a
        with:
          plugin_dir: "."
          fail_on_severity: high
