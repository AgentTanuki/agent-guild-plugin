name: Plugin security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@11ff35008c1dde7d7b0c2978b0cd4f6b495448e8
        with:
          plugin_dir: "."
          fail_on_severity: high
